stages:
  score:
    cmd: >-
      uv run temporal-triage score
      --store data/01_raw/sequences
      --output-dir data/08_reporting
      --model-zip ../api/models/model.zip
      --threshold ${triage.threshold}
    deps:
      - src/temporal_model/triage/score.py
      - src/temporal_model/triage/report.py
      - src/temporal_model/triage/store.py
      - src/temporal_model/triage/model_config.py
      - src/temporal_model/triage/cli.py
      - data/01_raw/sequences
      - ../api/models/model.zip
    params:
      - triage.threshold
    outs:
      - data/08_reporting/pyro-annotator/vit_dinov2_finetune:
          cache: true   # cached → dvc push shares the scored report (like monitor)
