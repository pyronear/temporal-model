name: push
on:
  push:
    tags:
      - "v*"

env:
  BACKEND_IMAGE_NAME: pyronear/temporal-model-api

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
      - name: Fetch model.zip from HuggingFace
        env:
          # Authenticate even though the repo is public: unauthenticated pulls of
          # the 163 MB model.zip get rate-limited (HTTP 429) under repeated CI runs.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd api
          uv sync --no-dev
          uv run python -m temporal_model.api.release \
            fetch --version "$VERSION" --output models/model.zip
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PW }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.BACKEND_IMAGE_NAME }}:latest
