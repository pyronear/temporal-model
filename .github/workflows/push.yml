name: push
on:
  push:
    branches: main
    tags:
      - "v*"

env:
  BACKEND_IMAGE_NAME: pyronear/temporal-model-api

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi
      - name: Build docker
        run: docker build -f api/Dockerfile . -t $BACKEND_IMAGE_NAME:$IMAGE_TAG
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PW }}
      - name: Push to hub
        run: docker push $BACKEND_IMAGE_NAME:$IMAGE_TAG
