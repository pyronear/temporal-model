name: push
on:
  push:
    tags:
      - "v*"

env:
  BACKEND_IMAGE_NAME: pyronear/temporal-model-api

permissions:
  contents: read

jobs:
  publish-model:
    # Publishes the model.zip packaged by train's pipeline at this commit as
    # api/MODEL_VERSION, unless that version is already on HuggingFace.
    # `release publish` creates the HF tag last, so the tag is the "done"
    # marker: a code-only release skips, a failed publish retries cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check whether the model version is already published
        id: check
        run: |
          MODEL_VERSION=$(cat api/MODEL_VERSION)
          if [ -z "$MODEL_VERSION" ]; then
            echo "api/MODEL_VERSION is missing or empty" >&2
            exit 1
          fi
          echo "MODEL_VERSION=$MODEL_VERSION" >> "$GITHUB_ENV"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://huggingface.co/api/models/pyronear/temporal-model/revision/v$MODEL_VERSION")
          case "$status" in
            200) echo "v$MODEL_VERSION is already on HuggingFace, nothing to publish"
                 echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected HTTP $status from HuggingFace" >&2; exit 1 ;;
          esac
      - name: Configure AWS credentials
        if: steps.check.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3
      - name: Install uv
        if: steps.check.outputs.publish == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
      - name: Pull the packaged model.zip from DVC
        if: steps.check.outputs.publish == 'true'
        working-directory: train
        run: uvx --from 'dvc[s3]' dvc pull data/06_models/vit_dinov2_finetune/model.zip
      - name: Export ONNX and publish to HuggingFace
        if: steps.check.outputs.publish == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # needs write access to the model repo
        run: |
          MODEL=$PWD/train/data/06_models/vit_dinov2_finetune/model.zip
          ONNX=$RUNNER_TEMP/model_onnx.zip
          # core's dev env has the torch + onnx extras the export needs; api's does not.
          uv run --project core temporal-export-onnx --model "$MODEL" --output "$ONNX"
          uv run --project api --no-dev python -m temporal_model.api.release \
            publish --version "$MODEL_VERSION" --file "$MODEL" --onnx-file "$ONNX"

  docker:
    needs: publish-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve versions
        # The image version comes from the git tag; the bundled model version is
        # pinned in api/MODEL_VERSION (the two are decoupled — code can change
        # without retraining).
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          MODEL_VERSION=$(cat api/MODEL_VERSION)
          if [ -z "$MODEL_VERSION" ]; then
            echo "api/MODEL_VERSION is missing or empty" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MODEL_VERSION=$MODEL_VERSION" >> $GITHUB_ENV
          echo "Building API version $VERSION with model version $MODEL_VERSION"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
      - name: Fetch model.zip from HuggingFace
        env:
          # Authenticate even though the repo is public: unauthenticated pulls of
          # the 163 MB model.zip get rate-limited (HTTP 429) under repeated CI runs.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd api
          uv sync --no-dev
          uv run python -m temporal_model.api.release \
            fetch --version "$MODEL_VERSION" --output models/model.zip
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PW }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.BACKEND_IMAGE_NAME }}:latest

  sync-space:
    # The demo follows each repo's latest release and caches the models it
    # loaded, so restart it even when demo/ is unchanged (no upload commit).
    needs: publish-model
    runs-on: ubuntu-latest
    env:
      SPACE: pyronear/Pyronear-Wildfire-Detection
      HF_TOKEN: ${{ secrets.HF_TOKEN }}  # needs write access to the Space
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Sync demo/ to the Space
        working-directory: demo
        run: make push SPACE="$SPACE"
      - name: Restart the Space and wait until it runs
        run: |
          uv run --no-project --with huggingface_hub python - <<'EOF'
          import os
          import time

          from huggingface_hub import HfApi

          api, space = HfApi(), os.environ["SPACE"]
          api.restart_space(space)
          time.sleep(30)  # let the stage leave RUNNING before polling
          deadline = time.time() + 20 * 60
          while time.time() < deadline:
              stage = api.get_space_runtime(space).stage
              print(stage, flush=True)
              if stage == "RUNNING":
                  break
              if stage.endswith("ERROR") or stage == "NO_APP_FILE":
                  raise SystemExit(f"{space} failed to start: {stage}")
              time.sleep(20)
          else:
              raise SystemExit(f"{space} not RUNNING after 20 min")
          EOF

  release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/create-github-release.sh "$GITHUB_REF_NAME"
