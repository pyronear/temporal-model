name: push
on:
  push:
    tags:
      - "v*"

env:
  BACKEND_IMAGE_NAME: pyronear/temporal-model-api

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.11"
      - name: Fetch model.zip from HuggingFace
        run: |
          cd api
          uv sync --no-dev
          uv run python -m temporal_model.api.release \
            fetch --version "$VERSION" --output models/model.zip
      - name: Build docker
        run: docker build -f api/Dockerfile . -t $BACKEND_IMAGE_NAME:$VERSION
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PW }}
      - name: Push to hub
        run: docker push $BACKEND_IMAGE_NAME:$VERSION
