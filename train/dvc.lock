    params:
      params.yaml:
        augment:
          enabled: true
          spatial:
            flip_prob: 0.5
            rotation_deg: 5.0
            scale_range:
            - 0.9
            - 1.1
            translate_frac: 0.05
          photometric:
            brightness_range:
            - 0.8
            - 1.2
            contrast_range:
            - 0.8
            - 1.2
            saturation_range:
            - 0.8
            - 1.2
