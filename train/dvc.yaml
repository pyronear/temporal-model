stages:
  truncate:
    foreach:
      - train
      - val
    do:
      cmd: >-
        uv run python -m temporal_model.train.truncate
        --input-dir data/01_raw/datasets_full/${item}
        --output-dir data/01_raw/datasets/${item}
        --max-frames ${truncate.max_frames}
      deps:
        - src/temporal_model/train/truncate.py
        - data/01_raw/datasets_full/${item}
      params:
        - truncate.max_frames
      outs:
        - data/01_raw/datasets/${item}

  build_tubes:
    foreach:
      - train
      - val
    do:
      cmd: >-
        uv run python -m temporal_model.train.build_tubes
        --input-dir data/01_raw/datasets/${item}
        --output-dir data/03_primary/tubes/${item}
        --iou-threshold ${tubes.iou_threshold}
        --max-misses ${tubes.max_misses}
        --min-tube-length ${build_tubes.min_tube_length}
        --min-detected-entries ${build_tubes.min_detected_entries}
        --merge-iomin ${tubes.merge_iomin}
        --merge-prox-factor ${tubes.merge_prox_factor}
        --merge-max-gap ${tubes.merge_max_gap}
      deps:
        - src/temporal_model/train/build_tubes.py
        - ../core/src/temporal_model/core/tubes.py
        - ../core/src/temporal_model/core/sequences.py
        - ../core/src/temporal_model/core/labels.py
        - ../core/src/temporal_model/core/protocol.py
        - ../core/src/temporal_model/core/types.py
        - data/01_raw/datasets/${item}
      params:
        - tubes
        - build_tubes
      outs:
        - data/03_primary/tubes/${item}

  build_model_input:
    foreach:
      - train
      - val
    do:
      cmd: >-
        uv run python -m temporal_model.train.build_model_input
        --tubes-dir data/03_primary/tubes/${item}
        --raw-dir data/01_raw/datasets/${item}
        --output-dir data/05_model_input/${item}
        --context-factor ${model_input.context_factor}
        --patch-size ${model_input.patch_size}
        --stabilize ${model_input.stabilize}
      deps:
        - src/temporal_model/train/build_model_input.py
        - src/temporal_model/train/crop_patches.py
        - ../core/src/temporal_model/core/crop.py
        - ../core/src/temporal_model/core/sequences.py
        - ../core/src/temporal_model/core/stabilize.py
        - data/03_primary/tubes/${item}
        - data/01_raw/datasets/${item}
      params:
        - model_input
      outs:
        - data/05_model_input/${item}

  train:
    cmd: >-
      uv run python -m temporal_model.train.train
      --train-dir data/05_model_input/train
      --val-dir data/05_model_input/val
      --output-dir data/06_models/vit_dinov2_finetune
      --params-path params.yaml
      --params-key train_vit_dinov2_finetune
    deps:
      - src/temporal_model/train/train.py
      - src/temporal_model/train/augment.py
      - src/temporal_model/train/dataset.py
      - src/temporal_model/train/lit_temporal.py
      - src/temporal_model/train/training_plots.py
      - src/temporal_model/train/batch_samples.py
      - ../core/src/temporal_model/core/temporal_classifier.py
      - data/05_model_input/train
      - data/05_model_input/val
    params:
      - train_vit_dinov2_finetune
      - augment
    outs:
      - data/06_models/vit_dinov2_finetune/best_checkpoint.pt
      - data/06_models/vit_dinov2_finetune/csv_logs/
    plots:
      - data/06_models/vit_dinov2_finetune/plots/training_curves.png

  package:
    cmd: >-
      uv run python -m temporal_model.train.package
      --variant vit_dinov2_finetune
      --output data/06_models/vit_dinov2_finetune/model.zip
    deps:
      - src/temporal_model/train/package.py
      - src/temporal_model/train/calibration.py
      - src/temporal_model/train/logistic_calibrator_fit.py
      - src/temporal_model/train/val_predict.py
      - src/temporal_model/train/package_predict.py
      - src/temporal_model/train/dataset.py
      - ../core/src/temporal_model/core/package.py
      - ../core/src/temporal_model/core/model.py
      - ../core/src/temporal_model/core/inference.py
      - ../core/src/temporal_model/core/stabilize.py
      - ../core/src/temporal_model/core/logistic_calibrator.py
      - ../core/src/temporal_model/core/tubes.py
      - ../core/src/temporal_model/core/sequences.py
      - ../core/src/temporal_model/core/detector.yaml
      - data/06_models/vit_dinov2_finetune/best_checkpoint.pt
      - data/06_models/detectors/yolo11s_nimble-narwhal_v6.0.0/yolo_weights.pt
      - data/05_model_input/val
      - data/01_raw/datasets/train
      - data/01_raw/datasets/val
    params:
      - package
      - tubes
      - build_tubes
      - model_input
      - train_vit_dinov2_finetune
    outs:
      - data/06_models/vit_dinov2_finetune/model.zip
