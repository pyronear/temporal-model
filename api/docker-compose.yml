services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TEMPORAL_API_MODEL_PATH=/models/model.zip
      - TEMPORAL_API_S3_BUCKET=frames
      - TEMPORAL_API_S3_ENDPOINT_URL=http://minio:9000
      - TEMPORAL_API_S3_REGION=us-east-1
      # local-dev only — change credentials for any shared/staging environment
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./models:/models
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # local-dev only — change credentials for any shared/staging environment
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data

  # One-shot: wait for MinIO, then create the frames bucket the API reads from.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/frames;
      echo 'bucket frames ready';
      "

volumes:
  minio-data:
