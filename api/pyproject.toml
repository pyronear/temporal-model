[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporal-model-api"
version = "0.1.0"
description = "FastAPI serving layer for the temporal smoke classifier"
requires-python = ">=3.11"
dependencies = [
    "temporal-model-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
]

[tool.uv.sources]
temporal-model-core = { path = "../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/temporal_model"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["temporal_model"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# starlette's TestClient opportunistically prefers the new `httpx2` package and
# warns when falling back to `httpx`. We intentionally stay on `httpx` (the dep
# starlette and fastapi officially declare), so silence that nudge.
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
