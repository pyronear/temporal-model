[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporal-model-eval"
version = "0.1.0"
description = "DVC evaluation pipeline for the temporal smoke classifier"
requires-python = ">=3.11"
dependencies = [
    "temporal-model-core",
    "numpy>=1.26,<2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.scripts]
temporal-eval = "temporal_model.eval.evaluate:main"

[tool.uv.sources]
temporal-model-core = { path = "../core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/temporal_model"]

[dependency-groups]
dev = [
    "dvc>=3.56",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["temporal_model"]

[tool.ruff.format]
quote-style = "double"
