[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporal-model-core"
version = "0.1.0"
description = "Core model, tube building, and inference for the temporal smoke classifier"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pydantic>=2.6",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
# Training, packaging, the torch backend and the ONNX export (which verifies
# the exported graph with onnxruntime, hence the [onnx] runtime deps too).
torch = [
    "torch>=2.2",
    "timm>=1.0",
    "ultralytics>=8.3",
    "onnx>=1.16",
    "onnxscript>=0.7",
    "onnxruntime>=1.17",
]
# Torch-free inference on model_onnx.zip (edge devices).
onnx = ["onnxruntime>=1.17"]

[project.scripts]
temporal-export-onnx = "temporal_model.core.export_onnx:main"

[tool.hatch.build.targets.wheel]
packages = ["src/temporal_model"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "temporal-model-core[torch,onnx]",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["temporal_model"]

[tool.ruff.format]
quote-style = "double"
